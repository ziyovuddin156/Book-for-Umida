<script>
var P=[
'<div class="c"><div class="o"></div><div class="s">мини-книга</div><h1>Умида и Проклятие Дедлайна</h1><div class="s">в подарок на восемнадцатилетие</div></div>',
'<div class="c"><div class="s">Для Умиды.<br>С днём рождения.<br><br>Любые совпадения с реальностью не случайны.</div></div>',
'<div class="c"><div class="s">Глава 1</div><h2>«Устала от учёбы»</h2></div>',
'<p class="n">У Умиды было три главных врага: утренний будильник, домашка по грамматике и вопрос «А ты уже читала то, что задали?». Ответ на последний всегда был одинаковым: «Читала. Но не то».</p><p>Потому что «не то» было намного интереснее.</p><p>В тот вторник она сидела в аудитории на третьем ряду у окна, держала телефон под учебником и дочитывала фанфик на сорок тысяч слов. Преподаватель что-то объяснял про герундий и его функции, но для Умиды существовала только одна функция: <i>пролистать вниз, пока не станет совсем интересно</i>.</p>',
'<p class="n">Главный герой фанфика, разумеется, был Драко Малфой. Он как раз произносил речь, от которой у неё внутри делалось тепло, а снаружи оставалось каменное лицо отличницы, которая «очень внимательно слушает».</p><p>— Умида, — раздалось откуда-то издалека. — Повтори, что я сказал.</p><p>Она медленно подняла глаза. В аудитории стояла такая тишина, как перед объявлением результатов сессии.</p><p>— Вы сказали… — начала Умида и сделала паузу, которой позавидовал бы любой актёр. — Что нужно быть внимательнее.</p>',
'<p class="n">Преподаватель прищурился. Группа задержала дыхание. И тут случилось чудо: прозвенел звонок.</p><p>«Спасена», — подумала Умида и тихо добавила под нос свою любимую фразу:</p><p>— Устала от учёбы.</p><p>Это была не жалоба, а скорее девиз. Она произносила его так серьёзно, будто это древний обет какого-то рыцарского ордена: усталых, мудрых и вечно недоспавших.</p>',
'<p class="n">Проблема была в том, что на соседнем ряду, через проход, сидел <i>он</i>.</p><p>Парень, которого она знала ещё со школы, но в университете он за последний месяц как-то подозрительно часто оказывался рядом. То пропускал её в дверях, то давал ручку, когда у неё «внезапно» заканчивалась своя (хотя в рюкзаке жила целая коллекция), то улыбался так, что у Умиды в голове случался сбой системы.</p><p>И главное: он тоже стеснялся.</p>',
'<p class="n">Это выяснилось на третьей неделе, когда они оба одновременно потянулись к одной двери и одновременно сказали «проходи».</p><p>— Проходи, — сказал он.</p><p>— Нет, ты, — сказала она.</p><p>— Ты первая.</p><p>— Я не тороплюсь.</p><p>— Я тоже.</p><p>Так они стояли ещё секунд десять, пока сзади не вздохнул уставший одногруппник: «Да идите уже оба!»</p>',
'<p class="n">Вечером Умида вернулась домой на два часа позже обычного, с рюкзаком, где лежала недоделанная домашка, и с таким счастливым лицом, что мама, открывая дверь, спросила только:</p><p>— Что случилось?</p><p>— Ничего. Просто устала от учёбы.</p><p>Мама посмотрела на неё внимательно, улыбнулась и ничего не ответила. Ей всё было понятно.</p>',
'<div class="c"><div class="s">Глава 2</div><h2>«Прогулка на пятнадцать минут»</h2></div>',
'<p class="n">В ту ночь Умида заснула на самом интересном месте фанфика. Проснулась она от запаха свечей и тыквенного сока. Над головой парили сотни свечей, а на ней была мантия, которая сидела подозрительно хорошо.</p><p>— Опоздала, — протянули за спиной.</p><p>Драко Малфой стоял, скрестив руки, с той самой усмешкой, которую она знала наизусть.</p>',
'<p class="n">— Это сон, — сказала Умида.</p><p>— Конечно, сон, — согласился Драко. — Но я всё равно произнесу речь.</p><p>— Только не на сорок тысяч слов.</p><p>— А на сколько?</p><p>— На четыреста.</p><p>Он обиженно замолчал. Впервые в истории фанфиков Драко Малфою пришлось уложиться в четыреста слов, и, по общему мнению зала, получилось даже лучше.</p>',
'<p class="n">Тут двери Большого зала скрипнули, и вошёл он. Мантия надета наизнанку, шарф чужого факультета, а лицо такое красное, что им можно было зажигать свечи. Он заметил Умиду и застыл.</p><p>— Привет, — сказал он.</p><p>— Привет. Ты первый.</p><p>— Нет, ты.</p><p>Весь зал вздохнул: «Опять».</p>',
'<p class="n">Распределяющая шляпа думала над ним два часа.</p><p>— Слишком вежливый для Слизерина, — бормотала она. — Слишком упрямый для Пуффендуя. Слишком много читает, чтобы в этом признаться… Давайте так: пока погуляйте, потом решим.</p><p>Они вышли в коридор «на пятнадцать минут».</p>',
'<p class="n">Они шли мимо движущихся лестниц, шепчущихся портретов и привидения, которое делало вид, что его здесь нет.</p><p>— Мы идём пятнадцать минут, — сказала Умида.</p><p>— Мне кажется, уже часа два, — ответил он.</p><p>Мимо пролетел профессор, у которого часы на руке просто сдались.</p><p>— Магия, — шепнула она.</p><p>— Или просто мы.</p>',
'<p class="n">Но на повороте путь преградил Драко.</p><p>— Зачёт по фонетике, — объявил он зловеще.</p><p>Умида вздохнула и произнесла древнее заклинание:</p><p>— Устала от учёбы.</p><p>Стены дрогнули, свечи погасли, и мир свернулся с хлопком, как страница. Она открыла глаза: потолок, подушка, телефон на лице, три часа ночи. Экран мигнул: «Не спишь?»</p>',
'<div class="c"><div class="s">Глава 3</div><h2>«Восемнадцать»</h2></div>',
'<p class="n">Утром ей исполнилось восемнадцать. Ничего не изменилось: будильник был таким же противным, список неправильных глаголов таким же невыученным. Только телефон светился от сообщений, и первое пришло от него, ровно в полночь:</p><p>«С днём рождения. Выходи гулять. Только на пятнадцать минут».</p>',
'<p class="n">Он ждал у подъезда, красный, как в самый первый день, и что-то прятал за спиной.</p><p>— Я не умею красиво говорить, — начал он.</p><p>— Я тоже, — сказала Умида.</p><p>— Тогда будем молчать красиво.</p><p>Они простояли секунд десять. Сосед с третьего этажа вздохнул: «Да обнимитесь уже!»</p>',
'<p class="n">Он протянул ей книгу. На обложке было её имя.</p><p>— Это про тебя, — выдавил он. — Про девочку, которая устала от учёбы, читала фанфики на лекциях и однажды превратила обычный вторник в магию.</p><p>Умида открыла первую страницу и узнала всё: звонок, проход в дверях, ночь разговоров.</p><p>— Ты это всё помнишь?</p><p>— Каждую секунду.</p>',
'<p class="n">Она листала страницы, а он краснел всё сильнее.</p><p>— Драко ты тоже вписал?</p><p>— Пришлось. Ты бы не простила.</p><p>— Он хотя бы хорошо получился?</p><p>— Лучше, чем в сорока тысячах слов.</p><p>— Вот теперь верю, — сказала Умида, и они оба засмеялись.</p>',
'<p class="n">— Куда пойдём?</p><p>— Куда-нибудь. Только не на пятнадцать минут.</p><p>Они пошли. Говорили про музыку, про фанфики, про то, как страшно взрослеть и как это не страшно, если рядом правильный человек. Когда Умида наконец посмотрела на часы, прошло два часа.</p>',
'<p class="n">— Подожди, — сказала она. — Мы же вышли на пятнадцать минут?</p><p>— Мне тоже так казалось.</p><p>— Значит, магия.</p><p>— Хогвартская?</p><p>— Наша.</p><p>Она взяла его за руку, и время, как и положено в хороших историях, перестало торопиться.</p>',
'<div class="c"><h2>Конец</h2><div class="s">С восемнадцатилетием, Умида ♥</div></div>',
'<p class="n" style="text-align:center;font-style:italic;opacity:.7">От автора</p><p class="n">18 лет — это уже огого какой возраст, порог, через который мы прошли вместе и в твоё, и в моё 18-летие. Поздравляю тебя от всего сердца. Эта книжка — лишь часть того, что ты получишь, конечно же 😅😇.</p><p>Конечно, в тот момент, когда писалась эта книга, не было твоего вишлиста, но я придумаю, что подарить, потому что и ты сама мне ничего не говоришь.</p>',
'<p class="n">За эти полтора года прошло много всего, и мы всё прошли вместе: и в хорошие дни, и в плохие, но мы были вместе.</p><p>Желаю тебе всего наилучшего, чтобы учёба была легче и зачёты сдавались легче.</p>',
'<p class="n">На этот момент я не знаю даже, что подарю, как я и говорил, но думаю, будущий я придумает что-то, и всё будет прекрасно.</p><p style="text-align:center;text-indent:0;margin-top:1.4em">Люблю тебя сильно, моя ты прекрасная 🥰❤️</p>'
];

 w.classList.add('show');

 else{w.style.zIndex=3;o.style.zIndex=1;w.style.transition='none';w.style.transform=T;void w.offsetWidth;w.style.transition='transform .4s ease-out';w.style.transform='';
  setTimeout(function(){o.classList.remove('show');w.style.transition='none';busy=false},420)}
 cur=n}
el[0].classList.add('show');
function next(){go(cur+1)}function prev(){go(cur-1)}
b.addEventListener('click',function(e){var r=b.getBoundingClientRect();(e.clientX-r.left>r.width/2)?next():prev()});
var x0=null;b.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
b.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40){d<0?next():prev();e.preventDefault(
